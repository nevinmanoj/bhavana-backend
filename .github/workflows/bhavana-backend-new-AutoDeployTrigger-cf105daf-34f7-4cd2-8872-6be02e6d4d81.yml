name: Trigger auto deployment for bhavana-backend-new

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bhavana-backend-new-AutoDeployTrigger-cf105daf-34f7-4cd2-8872-6be02e6d4d81.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BHAVANABACKENDNEW_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BHAVANABACKENDNEW_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BHAVANABACKENDNEW_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bhavananew.azurecr.io
          registryUsername: ${{ secrets.BHAVANABACKENDNEW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BHAVANABACKENDNEW_REGISTRY_PASSWORD }}
          containerAppName: bhavana-backend-new
          resourceGroup: bhavana-new
          imageToBuild: bhavananew.azurecr.io/bhavana-backend-new:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


